<canvas width="600" height="400"></canvas>

<script>
    var tela = document.querySelector('canvas');
    var pincel = tela.getContext('2d');

    // Fundo marrom-avermelhado (cor oficial do Qatar)
    pincel.fillStyle = '#8A1538';
    pincel.fillRect(0, 0, 600, 400);

    // Faixa branca com borda serrilhada (9 pontas)
    pincel.fillStyle = 'white';
    pincel.beginPath();
    pincel.moveTo(0, 0);
    pincel.lineTo(180, 0);

    // Desenha as 9 pontas (dentes)
    var alturaPonta = 400 / 9;
    for (var i = 0; i < 9; i++) {
        var y1 = i * alturaPonta;
        var y2 = y1 + alturaPonta / 2;
        var y3 = y1 + alturaPonta;

        pincel.lineTo(220, y2);  // ponta para a direita
        pincel.lineTo(180, y3);  // volta
    }

    pincel.lineTo(0, 400);
    pincel.closePath();
    pincel.fill();

</script>
